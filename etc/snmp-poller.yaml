# AIrtg snmp-poller - main configuration file.
# Every option is documented in README.md. Values shown are the defaults
# unless stated otherwise.
#
# The configuration can be split: every *.yaml and *.yml file of
# global.include_dir (etc/conf.d) is read after this file, in name order,
# with the same format. Devices and sinks of all files are combined;
# logging and vault may be defined in one file only; global only here.
# No device and no sink are configured by default: add yours in files of
# etc/conf.d (see etc/conf.d/devices.yaml.example and
# etc/conf.d/sinks.yaml.example). Without a sink, polled data is sent
# nowhere.

global:
  threads: 250                 # concurrent polls (worker pool size)
  poll_interval: 60s           # default for devices
  discovery_interval: 1h       # default for devices; discovery also runs on the first poll
  timeout: 5s                  # per SNMP request
  retries: 1
  max_oids_per_request: 30     # varbinds per GET request
  max_repetitions: 25          # GETBULK max-repetitions (v2c/v3 walks)
  port: 161
  transport: udp               # default for devices: udp or tcp
  walk: bulk                   # default for devices: bulk (GETBULK) or getnext; SNMPv1 always uses getnext
  data_dir: data               # device state (wiped on startup), credentials key, sink disk buffers
  include_dir: conf.d          # more configuration files (relative to this file)
  capabilities_dir: capabilities.d  # SNMP capabilities, one file each (relative to this file)
  stats_interval: 1m           # periodic summary log line
  shutdown_timeout: 30s        # grace period for in-flight polls on SIGINT/SIGTERM
  hot_reload: true             # reload when a file changes (false: on SIGHUP only)

logging:
  level: info                  # debug, info, warn, error
  local_time: false            # timestamps and rotated file names in UTC (true = local time zone)
  console:
    enabled: true
  file:
    enabled: true
    path: logs/snmp-poller.log # rotated to logs/snmp-poller-<time>.log.gz
    max_size_mb: 50            # rotate when the file reaches this size
    max_backups: 10            # rotated files to keep (0 = all)
    max_age_days: 30           # delete rotated files older than this (0 = never)
    compress: true             # gzip rotated files
