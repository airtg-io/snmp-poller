# Capability "host-resources": HOST-RESOURCES-MIB (1.3.6.1.2.1.25), RFC 2790:
# processes, memory, storage (RAM, swap, file systems) and processor load of
# servers and other hosts. Applies to devices that implement the MIB
# (detected at discovery). Its hrSystemUptime is the preferred source of the
# `uptime` metric of the "system" capability.
#
# Values are sent as the agent reports them, in its units: memory in
# kilobytes (hrMemorySize, UNITS "KBytes"), storage in allocation units of
# hrStorageAllocationUnits bytes each. Per storage row, formulas also give
# the size, used and free space in bytes (allocation units x bytes per
# allocation unit) and the used and free percentages. A formula reads the
# values of the same poll defined above it; when one is missing, or a size
# is 0, it gives no sample.
description: HOST-RESOURCES-MIB processes, memory, storage and processor load

detect:
  - 1.3.6.1.2.1.25                     # host

discovery:
  columns:
    hrStorageType:  1.3.6.1.2.1.25.2.3.1.2   # an OID, e.g. ...25.2.1.4 = hrStorageFixedDisk
    hrStorageDescr: 1.3.6.1.2.1.25.2.3.1.3   # e.g. "Physical memory", "/var"
    hrDeviceDescr:  1.3.6.1.2.1.25.3.2.1.3   # e.g. the processor model

scalars:
  - { name: hrSystemProcesses, oid: 1.3.6.1.2.1.25.1.6.0, unit: process }
  - { name: hrMemorySize, oid: 1.3.6.1.2.1.25.2.2.0, unit: kilobyte }

tables:
  - name: storage
    label: hrStorageDescr
    labels: [hrStorageType]
    columns:
      - { name: hrStorageAllocationUnits, oid: 1.3.6.1.2.1.25.2.3.1.4, unit: byte }
      - { name: hrStorageSize, oid: 1.3.6.1.2.1.25.2.3.1.5, unit: allocation unit }
      - { name: hrStorageUsed, oid: 1.3.6.1.2.1.25.2.3.1.6, unit: allocation unit }
      - { name: storageSize, formula: "hrStorageSize * hrStorageAllocationUnits", unit: byte }
      - { name: storageUsed, formula: "hrStorageUsed * hrStorageAllocationUnits", unit: byte }
      - { name: storageFree, formula: "storageSize - storageUsed", unit: byte }
      - { name: storageUsedPercent, formula: "storageUsed * 100 / storageSize", unit: percent }
      - { name: storageFreePercent, formula: "storageFree * 100 / storageSize", unit: percent }

  # hrProcessorTable shares its index with hrDeviceTable. Walked on every
  # poll: its rows are the processors only.
  - name: processors
    labels: [hrDeviceDescr]
    columns:
      # Average share of the last minute the processor was not idle.
      - { name: hrProcessorLoad, oid: 1.3.6.1.2.1.25.3.3.1.2, unit: percent }
