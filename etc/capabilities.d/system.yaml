# Capability "system": SNMPv2-MIB system group (1.3.6.1.2.1.1).
# No `detect`: applies to every device (unless the device excludes it).
# Discovery scalars are cached in data/<device_id>/discovery.json and
# attached to every batch sent to outputs. Polled every cycle:
#   - uptime: how long the system has been up. From HOST-RESOURCES-MIB
#     hrSystemUptime when the agent has it (chosen at discovery), else from
#     sysUpTime: on hosts, sysUpTime is the uptime of the SNMP agent, which
#     restarts without the system; on most network devices both are the
#     same.
#   - sysUpTime: the agent uptime, so agent restarts (and so counter
#     resets) show up right away.
# Both are TimeTicks, in hundredths of a second.
description: SNMPv2-MIB system group

discovery:
  scalars:
    sysDescr:    1.3.6.1.2.1.1.1.0
    sysObjectID: 1.3.6.1.2.1.1.2.0
    sysUpTime:   1.3.6.1.2.1.1.3.0
    sysContact:  1.3.6.1.2.1.1.4.0
    sysName:     1.3.6.1.2.1.1.5.0
    sysLocation: 1.3.6.1.2.1.1.6.0

scalars:
  - name: uptime
    oids:                              # first one the agent has
      - 1.3.6.1.2.1.25.1.1.0           # hrSystemUptime
      - 1.3.6.1.2.1.1.3.0              # sysUpTime
    unit: centiseconds
  - { name: sysUpTime, oid: 1.3.6.1.2.1.1.3.0, unit: centiseconds }
