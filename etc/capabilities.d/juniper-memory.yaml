# Capability "juniper-memory": memory of Juniper Junos devices, from
# JUNIPER-MIB jnxOperatingTable (1.3.6.1.4.1.2636.3.1.13.1), the table behind
# "show chassis routing-engine" and "show chassis fpc".
#
# Applies to devices that have jnxOperatingMemory (detected at discovery):
# MX, EX, QFX, PTX, SRX, ACX, vMX, vSRX, ...
#
# jnxOperatingTable has one row per component of the chassis (Routing
# Engines, FPCs, PICs, fans, power supplies, ...), indexed by
# jnxOperatingContentsIndex.L1.L2.L3, and reports 0 for what a component
# does not have: only the rows that have memory are polled, selected at
# discovery by their jnxOperatingDescr ("Routing Engine 0", "FPC: MPC7E 3D
# 40XGE @ 0/*/*", ...). A device can poll other rows with its own include.
#
# The agent reports the installed memory in megabytes (jnxOperatingMemory)
# and its utilization as a whole percentage (jnxOperatingBuffer, the "Memory
# utilization" of the CLI): both are sent as they are, and the memory in use
# is computed from them in megabytes, to 1% of the size. FPCs also report
# the utilization of their heap.
description: Juniper JUNIPER-MIB memory of every Routing Engine and FPC

detect:
  - 1.3.6.1.4.1.2636.3.1.13.1.15       # jnxOperatingMemory

discovery:
  columns:
    jnxOperatingDescr: 1.3.6.1.4.1.2636.3.1.13.1.5   # e.g. "Routing Engine 0"

tables:
  - name: juniper_memory
    label: jnxOperatingDescr
    include: ["^Routing Engine", "^FPC"]
    columns:
      - { name: jnxOperatingMemory, oid: 1.3.6.1.4.1.2636.3.1.13.1.15, unit: megabyte }
      # Share of the memory in use (0 to 100).
      - { name: jnxOperatingBuffer, oid: 1.3.6.1.4.1.2636.3.1.13.1.11, unit: percent }
      # Share of the heap in use (0 to 100), 0 where there is none.
      - { name: jnxOperatingHeap,   oid: 1.3.6.1.4.1.2636.3.1.13.1.12, unit: percent }
      - { name: jnxMemoryUsed, formula: "jnxOperatingMemory * jnxOperatingBuffer / 100", unit: megabyte }
